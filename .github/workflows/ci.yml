name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit hash; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the project with development tools
        run: python -m pip install -r requirements.txt -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy

      # The SARIF output is checked against the specification, not just our
      # own expectations, so a dashboard will accept what the tool writes.
      - name: Fetch the official SARIF 2.1.0 schema
        run: >
          curl -fsSL -o sarif-schema-2.1.0.json
          https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json

      # Includes end-to-end scans of local OpenSSL servers (tests/test_integration.py)
      # and schema validation of the SARIF output.
      - name: Run tests
        run: pytest
        env:
          SARIF_SCHEMA: sarif-schema-2.1.0.json

  # The web interface stores accounts, reports and the audit log in SQLite by
  # default and in PostgreSQL when hosted. The same tests run on both.
  postgres:
    name: Web tests on PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: tr02102
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the project with development tools
        run: python -m pip install -r requirements.txt -e ".[dev]"

      - name: Run the storage and web tests against PostgreSQL
        run: pytest tests/test_store.py tests/test_web.py
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/tr02102

  lab:
    name: Lab smoke test and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Start the lab and verify all targets
        run: docker compose -f lab/docker-compose.yml run --rm smoke

      # The web interface as it runs on a laptop: built from this commit,
      # allowed to check the lab network, trusting the lab CA.
      - name: Start the web interface and the practice server
        run: docker compose -f lab/docker-compose.yml up -d --build --wait web my-site

      - name: Use the web interface end to end
        run: python lab/scripts/web-e2e.py

      - name: Install the scanner
        run: python -m pip install -r requirements.txt .

      # The lab signs its certificates with its own throwaway CA. The scanner
      # is told to trust it, as it would be for a company's internal PKI.
      - name: Fetch the lab CA certificate
        run: docker compose -f lab/docker-compose.yml cp tls-good:/etc/nginx/certs/lab-ca.crt lab-ca.crt

      - name: Scan tls-good (expected to conform to every formal standard)
        run: tr02102-audit scan 127.0.0.1:8443 --ca-file lab-ca.crt

      - name: Scan tls-weak (expected to fail)
        run: |
          set +e
          tr02102-audit scan 127.0.0.1:8444 --ca-file lab-ca.crt
          code=$?
          if [ "$code" -ne 1 ]; then echo "expected exit code 1, got $code"; exit 1; fi

      # A typical modern website: good practice (rating A, conforms to IETF and
      # PCI DSS) and still outside the approved lists of BSI and NIST.
      - name: Scan tls-typical (good practice, but off the strict lists)
        run: |
          set +e
          tr02102-audit scan 127.0.0.1:8445 --ca-file lab-ca.crt --format json --output typical.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then echo "expected exit code 1, got $code"; exit 1; fi
          python - <<'EOF'
          import json
          report = json.load(open("typical.json"))
          verdicts = {e["standard"]["id"]: e["verdict"] for e in report["evaluations"]}
          print(report["rating"], verdicts)
          assert report["observation"]["complete"], report["observation"]["incomplete"]
          assert report["rating"]["grade"] in ("A", "A+"), report["rating"]
          assert verdicts["ietf-rfc9325"] == "pass_with_warnings"
          assert verdicts["pci-dss-4.0.1"] == "pass_with_warnings"
          assert verdicts["bsi-tr-02102-2"] == "fail"
          assert verdicts["nist-sp-800-52r2"] == "fail"
          EOF

      - name: Write a SARIF report for the weak lab server
        run: >
          tr02102-audit scan 127.0.0.1:8444 --ca-file lab-ca.crt
          --format sarif --output lab-tls-weak.sarif || true

      # Published as a build artifact rather than as code-scanning alerts: the
      # findings belong to the lab container, not to this repository.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-tls-weak-sarif
          path: lab-tls-weak.sarif
          if-no-files-found: error

      - name: Show container logs
        if: failure()
        run: docker compose -f lab/docker-compose.yml logs --no-color

      - name: Stop the lab
        if: always()
        run: docker compose -f lab/docker-compose.yml down -v

  image:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t tr02102-audit:ci .

      - name: Start and probe the web service
        run: |
          docker run -d --name web -p 8080:8080 \
            -e SECRET_KEY=ci -e APP_PASSWORD=ci-only-passphrase -e SESSION_COOKIE_SECURE=0 \
            tr02102-audit:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/demo/tls-weak | grep -q "Does not conform"
          curl -fsS "http://127.0.0.1:8080/login?lang=de" | grep -q "Anmelden"
          docker exec web id -u | grep -qv '^0$'   # must not run as root
          docker exec web test -s /data/tr02102-audit.db   # the database file is writable

      # Sign in as the administrator created from APP_PASSWORD and open the
      # administration, so the image is known to work end to end.
      - name: Sign in to the running container
        run: |
          jar=$(mktemp)
          token=$(curl -fsS -c "$jar" http://127.0.0.1:8080/login \
            | grep -o 'name="csrf" value="[^"]*"' | head -1 | cut -d'"' -f4)
          curl -fsS -b "$jar" -c "$jar" -o /dev/null \
            --data-urlencode "csrf=$token" --data-urlencode "login=admin" \
            --data-urlencode "password=ci-only-passphrase" http://127.0.0.1:8080/login
          curl -fsS -b "$jar" http://127.0.0.1:8080/admin | grep -q "Audit log"

      - name: Show logs
        if: always()
        run: docker logs web || true
