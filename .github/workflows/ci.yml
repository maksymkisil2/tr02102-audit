name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned to a commit hash; Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the project with development tools
        run: python -m pip install -r requirements.txt -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type-check
        run: mypy

      # The SARIF output is checked against the specification, not just our
      # own expectations, so a dashboard will accept what the tool writes.
      - name: Fetch the official SARIF 2.1.0 schema
        run: >
          curl -fsSL -o sarif-schema-2.1.0.json
          https://raw.githubusercontent.com/oasis-tcs/sarif-spec/main/sarif-2.1/schema/sarif-schema-2.1.0.json

      # Includes end-to-end scans of local OpenSSL servers (tests/test_integration.py)
      # and schema validation of the SARIF output.
      - name: Run tests
        run: pytest
        env:
          SARIF_SCHEMA: sarif-schema-2.1.0.json

  lab:
    name: Lab smoke test and scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Start the lab and verify both targets
        run: docker compose -f lab/docker-compose.yml run --rm smoke

      - name: Install the scanner
        run: python -m pip install -r requirements.txt .

      # tls-good may only fail on its self-signed certificate (medium severity).
      # Mozilla Modern is left out: it rejects TLS 1.2, which tls-good offers.
      - name: Scan tls-good (expected to pass at --fail-on high)
        run: >
          tr02102-audit scan 127.0.0.1:8443 --fail-on high
          -s bsi-tr-02102-2 -s nist-sp-800-52r2 -s ietf-rfc9325
          -s ncsc-nl-tls-2025 -s mozilla-intermediate

      - name: Scan tls-weak (expected to fail)
        run: |
          set +e
          tr02102-audit scan 127.0.0.1:8444
          code=$?
          if [ "$code" -ne 1 ]; then echo "expected exit code 1, got $code"; exit 1; fi

      - name: Write a SARIF report for the weak lab server
        run: tr02102-audit scan 127.0.0.1:8444 --format sarif --output lab-tls-weak.sarif || true

      # Published as a build artifact rather than as code-scanning alerts: the
      # findings belong to the lab container, not to this repository.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-tls-weak-sarif
          path: lab-tls-weak.sarif
          if-no-files-found: error

      - name: Show container logs
        if: failure()
        run: docker compose -f lab/docker-compose.yml logs --no-color

      - name: Stop the lab
        if: always()
        run: docker compose -f lab/docker-compose.yml down -v

  image:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t tr02102-audit:ci .

      - name: Start and probe the web service
        run: |
          docker run -d --name web -p 8080:8080 -e SECRET_KEY=ci -e APP_PASSWORD=ci tr02102-audit:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/demo/tls-weak | grep -q "Does not conform"
          docker exec web id -u | grep -qv '^0$'   # must not run as root

      - name: Show logs
        if: always()
        run: docker logs web || true
