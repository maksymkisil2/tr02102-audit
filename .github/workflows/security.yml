name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory is noticed without a code change.
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install the project and the audit tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pip-audit

      - name: Check installed packages against known vulnerabilities
        run: pip-audit --skip-editable
