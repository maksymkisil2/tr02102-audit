# Render Blueprint: one-click deployment of the web interface.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tr02102-audit
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # Asked for once when the Blueprint is created. Password of the first
      # administrator (login name: admin). Without it the site is demo-only.
      - key: APP_PASSWORD
        sync: false
      # PostgreSQL connection string. The free plan has no persistent disk, so
      # without a database accounts, reports and the audit log are lost on
      # every restart. Leave empty to try the service out.
      - key: DATABASE_URL
        sync: false
      # Who runs this instance; shown in the imprint and the privacy notice.
      - key: OPERATOR_NAME
        sync: false
      - key: OPERATOR_ADDRESS
        sync: false
      - key: OPERATOR_EMAIL
        sync: false
      # Long random value generated by Render; signs the session cookie.
      - key: SECRET_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
