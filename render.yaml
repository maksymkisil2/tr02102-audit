# Render Blueprint: one-click deployment of the web interface.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tr02102-audit
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      # Asked for once when the Blueprint is created. Without it the site is demo-only.
      - key: APP_PASSWORD
        sync: false
      # Long random value generated by Render; signs the session cookie.
      - key: SECRET_KEY
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
