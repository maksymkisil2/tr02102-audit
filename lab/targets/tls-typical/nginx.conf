# Lab target "tls-typical": what a well-run public website looks like today.
#
# TLS 1.2 and 1.3, forward secrecy only, AEAD only, but with the choices most
# of the internet makes: ChaCha20-Poly1305, Curve25519 and a 2048-bit RSA
# certificate. Good practice by IETF and PCI DSS standards, and still outside
# the approved lists of BSI TR-02102-2 and NIST SP 800-52. This server is the
# fixture for exactly that difference.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;

    server {
        listen 443 ssl;
        server_name tls-typical;

        ssl_certificate     /etc/nginx/certs/tls-typical.crt;
        ssl_certificate_key /etc/nginx/certs/tls-typical.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        # TLS 1.2 cipher suites; TLS 1.3 keeps the library defaults,
        # which include TLS_CHACHA20_POLY1305_SHA256.
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;

        ssl_ecdh_curve X25519:prime256v1:secp384r1;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        location / {
            default_type text/plain;
            return 200 "tls-typical\n";
        }
    }
}
