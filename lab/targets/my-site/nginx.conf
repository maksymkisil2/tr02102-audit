# my-site: your own server to practise on.
#
# This file starts with nginx's built-in defaults, the way many servers run
# after installation. Change the TLS lines below, then apply and check:
#
#   docker compose -f lab/docker-compose.yml restart my-site
#
# and in the web interface (http://127.0.0.1:8080), under "My servers",
# press "Check again" and "Compare the two checks".
#
# Exercises, from easy to strict:
#   1. Rating A: offer only cipher suites with forward secrecy and AEAD.
#      Hint: the report's action plan shows the lines that do it.
#   2. Conform to RFC 9325 and PCI DSS without warnings.
#   3. Conform to BSI TR-02102-2 as well. You will need a different
#      certificate key: see lab/scripts/gen-certs.sh.
#   4. Break something on purpose (TLS 1.0, a CBC suite) and watch the
#      comparison show it.
#
# The server is reachable only from this computer (127.0.0.1:8446) and from
# the lab's own network.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;

    server {
        listen 443 ssl;
        server_name my-site;

        ssl_certificate     /etc/nginx/certs/my-site.crt;
        ssl_certificate_key /etc/nginx/certs/my-site.key;

        # ----- TLS settings: change these -----
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        # ---------------------------------------

        location / {
            default_type text/plain;
            return 200 "my-site\n";
        }
    }
}
