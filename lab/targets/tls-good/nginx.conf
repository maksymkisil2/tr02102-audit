# Lab target "tls-good": a modern TLS configuration.
#
# TLS 1.2 and 1.3 only, forward secrecy, AEAD cipher suites, NIST curves.
# This is the "expected to pass" fixture for the scanner's integration tests.

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;

    server {
        listen 443 ssl;
        server_name tls-good;

        ssl_certificate     /etc/nginx/certs/tls-good.crt;
        ssl_certificate_key /etc/nginx/certs/tls-good.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        # TLS 1.2 cipher suites
        ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256;
        # TLS 1.3 cipher suites
        ssl_conf_command Ciphersuites TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256;

        ssl_ecdh_curve secp384r1:prime256v1;
        ssl_prefer_server_ciphers on;
        ssl_session_tickets off;

        location / {
            default_type text/plain;
            return 200 "tls-good\n";
        }
    }
}
