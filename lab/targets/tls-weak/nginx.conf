# Lab target "tls-weak": DELIBERATELY INSECURE. Never copy this configuration.
#
# Legacy protocol versions, cipher suites without forward secrecy, CBC mode and
# a 2048-bit RSA key. This is the "expected to fail" fixture for the scanner's
# integration tests. It is published on 127.0.0.1 only (see docker-compose.yml).

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    access_log off;
    server_tokens off;

    server {
        listen 443 ssl;
        server_name tls-weak;

        ssl_certificate     /etc/nginx/certs/tls-weak.crt;
        ssl_certificate_key /etc/nginx/certs/tls-weak.key;

        # No TLS 1.3; TLS 1.0 and 1.1 still enabled.
        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

        # Security level 0 re-enables everything the TLS library would
        # otherwise refuse, including RSA key exchange and CBC suites.
        ssl_ciphers ALL:@SECLEVEL=0;
        ssl_prefer_server_ciphers off;

        location / {
            default_type text/plain;
            return 200 "tls-weak\n";
        }
    }
}
