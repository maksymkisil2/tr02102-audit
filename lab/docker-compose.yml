# Test lab: TLS servers with known configurations, your own server to
# practise on, and the web interface to check them.
#
#   web          http://127.0.0.1:8080    the web interface (login: admin)
#   tls-good     https://127.0.0.1:8443   hardened to the BSI lists (conforms everywhere)
#   tls-weak     https://127.0.0.1:8444   deliberately weak (fails everywhere)
#   tls-typical  https://127.0.0.1:8445   typical modern website (good practice,
#                                         but off the BSI and NIST approved lists)
#   my-site      https://127.0.0.1:8446   yours: edit targets/my-site/nginx.conf
#
# Start everything:   docker compose -f lab/docker-compose.yml up -d --build
# Stop and clean up:  docker compose -f lab/docker-compose.yml down -v
#
# All ports are bound to localhost only. tls-weak is insecure on purpose and
# must never be reachable from another machine.

name: tr02102-lab

x-tools: &tools
  image: tr02102-lab-tools:local
  build:
    context: .
    dockerfile: tools.Dockerfile

x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "nc -z 127.0.0.1 443"]
  interval: 2s
  timeout: 2s
  retries: 15

services:
  # One-shot job: creates throwaway certificates in a volume, then exits.
  certs:
    <<: *tools
    command: ["sh", "/lab/gen-certs.sh"]
    network_mode: none
    volumes:
      - ./scripts:/lab:ro
      - certs:/certs

  tls-good:
    image: nginx:1.28-alpine
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ./targets/tls-good/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs:ro
    healthcheck: *healthcheck

  tls-weak:
    image: nginx:1.28-alpine
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8444:443"
    volumes:
      - ./targets/tls-weak/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs:ro
    healthcheck: *healthcheck

  tls-typical:
    image: nginx:1.28-alpine
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8445:443"
    volumes:
      - ./targets/tls-typical/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs:ro
    healthcheck: *healthcheck

  # Your own server to practise on. Edit targets/my-site/nginx.conf, then:
  #   docker compose -f lab/docker-compose.yml restart my-site
  my-site:
    image: nginx:1.28-alpine
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8446:443"
    volumes:
      - ./targets/my-site/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/etc/nginx/certs:ro
    healthcheck: *healthcheck

  # The web interface, built from this repository. Inside the lab it may
  # check the lab's private network (PRIVATE_NETWORKS) and trusts the lab CA
  # (CA_FILE). The targets are reached by their service names, for example
  # "tls-typical" or "my-site" (port 443).
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tr02102-audit:lab
    depends_on:
      certs:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_PASSWORD: ${LAB_ADMIN_PASSWORD:-lab-admin-password}
      SECRET_KEY: ${LAB_SECRET_KEY:-lab-only-secret-not-for-production}
      SESSION_COOKIE_SECURE: "0"
      TRUST_PROXY: "0"
      PRIVATE_NETWORKS: ${LAB_PRIVATE_NETWORKS:-172.30.80.0/24}
      CA_FILE: /certs/lab-ca.crt
      CHECKS_PER_MONTH: "1000"
    volumes:
      - certs:/certs:ro
      - webdata:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Verifies that all targets behave as documented in lab/README.md.
  # Run with: docker compose -f lab/docker-compose.yml run --rm smoke
  smoke:
    <<: *tools
    profiles: ["smoke"]
    command: ["sh", "/lab/smoke-test.sh"]
    volumes:
      - ./scripts:/lab:ro
    depends_on:
      tls-good:
        condition: service_healthy
      tls-weak:
        condition: service_healthy
      tls-typical:
        condition: service_healthy

# A fixed address range, so the web service can be told which private
# network it may check.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.80.0/24

volumes:
  certs:
  webdata:
