# Example: audit your own TLS endpoint every week and send the result to
# GitHub code scanning, so a weakened configuration becomes an alert.
#
# Setup
#   1. Copy this file to .github/workflows/tls-audit.yml in your repository.
#   2. Set a repository variable TLS_TARGET to the endpoint you are allowed to
#      test, for example  www.example.org  or  mail.example.org:465
#      (Settings -> Secrets and variables -> Actions -> Variables).
#   3. Code scanning must be enabled for the repository (Settings -> Code
#      security). On a private repository this needs GitHub Advanced Security.
#
# Only audit systems you own or are permitted to test.

name: TLS audit

on:
  schedule:
    - cron: "17 5 * * 1" # Mondays, 05:17 UTC
  workflow_dispatch: # also runnable by hand, from a phone as well

permissions:
  contents: read
  security-events: write # required to upload the SARIF report

jobs:
  tls-audit:
    name: Audit ${{ vars.TLS_TARGET }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      # @main always installs the latest version. For a reproducible pipeline,
      # pin a release tag (@v0.1.0) or a commit hash instead.
      - name: Install the scanner
        run: >
          python -m pip install
          "tr02102-audit @ git+https://github.com/maksymkisil2/tr02102-audit@main"

      # The step keeps going when findings are reported, so the SARIF file is
      # always uploaded; the job still fails afterwards if something serious
      # was found.
      - name: Scan
        id: scan
        continue-on-error: true
        run: >
          tr02102-audit scan "${{ vars.TLS_TARGET }}"
          --standard bsi-tr-02102-2
          --standard mozilla-intermediate
          --format sarif
          --output tls.sarif
          --fail-on high

      - name: Upload the report to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: tls.sarif
          category: tls-audit

      - name: Fail the job on serious findings
        if: steps.scan.outcome == 'failure'
        run: |
          echo "The TLS audit reported findings; see the Security tab." >&2
          exit 1
