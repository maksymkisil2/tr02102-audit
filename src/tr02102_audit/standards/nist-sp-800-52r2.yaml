id: nist-sp-800-52r2
title: "NIST SP 800-52 Rev. 2: Guidelines for TLS Implementations"
short_name: NIST SP 800-52r2
publisher: National Institute of Standards and Technology (NIST)
edition: "2019-08"
url: https://csrc.nist.gov/pubs/sp/800/52/r2/final
region: USA
order: 2
description: >
  The US federal baseline for TLS, also used in FedRAMP and many international
  tenders. Restricted to FIPS-approved algorithms: no ChaCha20, no Curve25519.
  This profile applies the rules for government-only servers. NIST started a
  review of this publication in May 2026.
# Cipher-suite lists, versions, certificate and extension requirements were
# transcribed from the publication. The group list relies on SP 800-56A Rev. 3,
# Appendix D, which is referenced by section 3.4.2.2.
transcription: verified

rules:
  - id: NIST-01
    control: protocol-versions
    title: SSL 2.0/3.0 and TLS 1.0 are not used
    severity: high
    reference: "SP 800-52r2, sec. 3.1 (shall not use TLS 1.0, SSL 3.0, SSL 2.0)"
    check:
      subject: tls.protocol_versions
      op: none_of
      values: [SSL3.0, TLS1.0]
    remediation: Disable SSL 3.0 and TLS 1.0.

  - id: NIST-02
    control: protocol-versions
    title: TLS 1.1 is not used
    severity: medium
    on_violation: warn
    reference: "SP 800-52r2, sec. 3.1 (should not be configured to use TLS 1.1)"
    check:
      subject: tls.protocol_versions
      op: none_of
      values: [TLS1.1]
    remediation: Disable TLS 1.1.

  - id: NIST-03
    control: tls13-support
    title: TLS 1.3 is supported
    severity: high
    reference: "SP 800-52r2, sec. 3.1 (agencies shall support TLS 1.3 by January 1, 2024)"
    check:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.3
    remediation: Enable TLS 1.3.

  - id: NIST-04
    control: tls12-cipher-suites
    title: TLS 1.2 cipher suites are on the approved list
    severity: high
    reference: "SP 800-52r2, sec. 3.3.1.1"
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.2
    check:
      subject: tls.suites.tls12
      op: subset_of
      values:
        # 3.3.1.1.1 ECDSA certificates
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_CCM
        - TLS_ECDHE_ECDSA_WITH_AES_256_CCM
        - TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8
        - TLS_ECDHE_ECDSA_WITH_AES_256_CCM_8
        - TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA
        - TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA
        # 3.3.1.1.2 RSA certificates
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_DHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_DHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_DHE_RSA_WITH_AES_128_CCM
        - TLS_DHE_RSA_WITH_AES_256_CCM
        - TLS_DHE_RSA_WITH_AES_128_CCM_8
        - TLS_DHE_RSA_WITH_AES_256_CCM_8
        - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256
        - TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384
        - TLS_DHE_RSA_WITH_AES_128_CBC_SHA256
        - TLS_DHE_RSA_WITH_AES_256_CBC_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA
        - TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA
        - TLS_DHE_RSA_WITH_AES_128_CBC_SHA
        - TLS_DHE_RSA_WITH_AES_256_CBC_SHA
        # 3.3.1.1.3 DSA certificates
        - TLS_DHE_DSS_WITH_AES_128_GCM_SHA256
        - TLS_DHE_DSS_WITH_AES_256_GCM_SHA384
        - TLS_DHE_DSS_WITH_AES_128_CBC_SHA256
        - TLS_DHE_DSS_WITH_AES_256_CBC_SHA256
        - TLS_DHE_DSS_WITH_AES_128_CBC_SHA
        - TLS_DHE_DSS_WITH_AES_256_CBC_SHA
        # 3.3.1.1.5 static ECDH (acceptable; ephemeral preferred)
        - TLS_ECDH_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDH_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDH_ECDSA_WITH_AES_128_CBC_SHA256
        - TLS_ECDH_ECDSA_WITH_AES_256_CBC_SHA384
        - TLS_ECDH_ECDSA_WITH_AES_128_CBC_SHA
        - TLS_ECDH_ECDSA_WITH_AES_256_CBC_SHA
        - TLS_ECDH_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDH_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDH_RSA_WITH_AES_128_CBC_SHA256
        - TLS_ECDH_RSA_WITH_AES_256_CBC_SHA384
        - TLS_ECDH_RSA_WITH_AES_128_CBC_SHA
        - TLS_ECDH_RSA_WITH_AES_256_CBC_SHA
    remediation: >
      Use only AES with GCM, CCM or CBC and (EC)DHE or static (EC)DH key
      agreement. RSA key transport, ChaCha20 and Camellia are not on the list.

  - id: NIST-05
    control: tls13-cipher-suites
    title: TLS 1.3 cipher suites are FIPS-approved
    severity: high
    reference: "SP 800-52r2, sec. 3.3.1.2"
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.3
    check:
      subject: tls.suites.tls13
      op: subset_of
      values: [TLS_AES_128_GCM_SHA256, TLS_AES_256_GCM_SHA384, TLS_AES_128_CCM_SHA256, TLS_AES_128_CCM_8_SHA256]
    remediation: Remove TLS_CHACHA20_POLY1305_SHA256 (not a FIPS-approved cipher).

  - id: NIST-06
    control: broken-ciphers
    title: No broken or anonymous cipher suites
    severity: high
    reference: "SP 800-52r2, sec. 3.3.1 (at least 112 bits of security)"
    check:
      subject: tls.suites_broken
      op: empty
    remediation: Remove NULL, anonymous, export, RC4, DES and 3DES cipher suites.

  - id: NIST-07
    control: key-exchange-groups
    title: Key-exchange groups are NIST-approved
    severity: medium
    on_violation: warn
    reference: "SP 800-52r2, sec. 3.4.2.2; SP 800-56A Rev. 3, App. D"
    check:
      subject: tls.groups.tls13
      op: subset_of
      values: [secp256r1, secp384r1, secp521r1, ffdhe2048, ffdhe3072, ffdhe4096, ffdhe6144, ffdhe8192]
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.3
    remediation: >
      x25519 and x448 are not NIST-approved for key agreement in this revision.
      P-256 or P-384 must be supported.

  - id: NIST-08
    control: key-exchange-groups
    title: TLS 1.2 curves are NIST-approved
    severity: medium
    on_violation: warn
    reference: "SP 800-52r2, sec. 3.4.2.2; SP 800-56A Rev. 3, App. D"
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.2
    check:
      subject: tls.groups.tls12
      op: subset_of
      values: [secp256r1, secp384r1, secp521r1]
    remediation: Use P-256 and P-384.

  - id: NIST-09
    control: dh-parameters
    title: DH parameters are at least 2048 bit
    severity: high
    reference: "SP 800-52r2, sec. 3.3.1 and Table 3-1 (112-bit security)"
    when:
      subject: tls.dhe_prime_bits
      op: present
    check:
      subject: tls.dhe_prime_bits
      op: min
      value: 2048
    remediation: Use ffdhe2048 or larger.

  - id: NIST-10
    control: certificate-key
    title: RSA 2048+ or ECDSA on P-256/P-384
    severity: high
    reference: "SP 800-52r2, sec. 3.2 and Table 3-1"
    check:
      subject: certificate
      op: key_strength
      min_bits: {RSA: 2048, EC: 256}
      curves: [secp256r1, secp384r1]
    remediation: Use an RSA key of 2048 bit or more, or ECDSA on P-256 or P-384.

  - id: NIST-11
    control: certificate-signature
    title: Certificate is signed with SHA-224 or stronger
    severity: high
    reference: "SP 800-52r2, sec. 3.3.3"
    when:
      subject: certificate.signature_hash
      op: present
    check:
      subject: certificate.signature_hash
      op: one_of
      values: [sha224, sha256, sha384, sha512]
    remediation: Re-issue the certificate with SHA-256 or stronger.

  - id: NIST-12
    control: certificate-lifetime
    title: Certificate validity is 3 years or less
    severity: medium
    reference: "SP 800-52r2, Table 3-1"
    check:
      subject: certificate.lifetime_days
      op: max
      value: 1096
    remediation: Issue certificates with a shorter validity period.

  - id: NIST-13
    control: cbc-encrypt-then-mac
    title: CBC suites are used with Encrypt-then-MAC
    severity: medium
    reference: "SP 800-52r2, sec. 3.4.2.7 (shall support when CBC suites are configured)"
    check:
      subject: tls.cbc_without_encrypt_then_mac
      op: empty
    remediation: Enable encrypt_then_mac or remove CBC suites.

  - id: NIST-14
    control: extended-master-secret
    title: Extended master secret is supported
    severity: high
    reference: "SP 800-52r2, sec. 3.4.1.3 (shall support)"
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.2
    check:
      subject: tls.extended_master_secret
      op: is
      value: true
    remediation: Enable the extended_master_secret extension (RFC 7627).

  - id: NIST-15
    control: certificate-validity
    title: Certificate is within its validity period
    severity: high
    reference: "General requirement for server authentication"
    check:
      subject: certificate.expired
      op: is
      value: false
    remediation: Renew the certificate.

  - id: NIST-16
    control: certificate-trust
    title: Certificate chain and host name verify
    severity: medium
    reference: "SP 800-52r2, sec. 3.2 (trusted CA, matching names)"
    check:
      subject: certificate.trusted
      op: is
      value: true
      detail: certificate.trust_error
    remediation: Use a certificate from a trusted CA that covers the host name, and send the full chain.
