id: mozilla-intermediate
title: "Mozilla Server Side TLS: Intermediate"
short_name: Mozilla Intermediate
publisher: Mozilla
edition: "5.7"
url: https://wiki.mozilla.org/Security/Server_Side_TLS
description: >
  The general-purpose profile of Mozilla's server-side TLS guidelines, used by
  the Mozilla SSL Configuration Generator. Recommended for servers that must
  support a wide range of clients.
transcription: draft
region: International (Mozilla)
order: 5

rules:
  - id: MOZ-I-01
    control: protocol-versions
    title: Only TLS 1.2 and TLS 1.3 are offered
    severity: high
    reference: "Server Side TLS 5.7, Intermediate: protocols"
    check:
      subject: tls.protocol_versions
      op: subset_of
      values: [TLS1.2, TLS1.3]
    remediation: Disable SSL 3.0, TLS 1.0 and TLS 1.1.

  - id: MOZ-I-02
    control: tls12-cipher-suites
    title: TLS 1.2 cipher suites match the profile
    severity: high
    reference: "Server Side TLS 5.7, Intermediate: cipher suites (TLS 1.2)"
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.2
    check:
      subject: tls.suites.tls12
      op: subset_of
      values:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256
        - TLS_DHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_DHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_DHE_RSA_WITH_CHACHA20_POLY1305_SHA256
    remediation: >
      Use the cipher list from the Mozilla SSL Configuration Generator,
      Intermediate profile.

  - id: MOZ-I-03
    control: tls13-cipher-suites
    title: TLS 1.3 cipher suites match the profile
    severity: high
    reference: "Server Side TLS 5.7, Intermediate: cipher suites (TLS 1.3)"
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.3
    check:
      subject: tls.suites.tls13
      op: subset_of
      values: [TLS_AES_128_GCM_SHA256, TLS_AES_256_GCM_SHA384, TLS_CHACHA20_POLY1305_SHA256]
    remediation: Offer only the three standard AEAD suites.

  - id: MOZ-I-04
    control: forward-secrecy
    title: All TLS 1.2 key exchanges provide forward secrecy
    severity: high
    reference: "Server Side TLS 5.7, Intermediate: only (EC)DHE suites are listed"
    check:
      subject: tls.suites_without_forward_secrecy
      op: empty
    remediation: Remove cipher suites with static RSA or static (EC)DH key exchange.

  - id: MOZ-I-05
    control: broken-ciphers
    title: No broken or anonymous cipher suites
    severity: high
    reference: "Server Side TLS 5.7, Intermediate"
    check:
      subject: tls.suites_broken
      op: empty
    remediation: Remove NULL, anonymous, export, RC4, DES and 3DES cipher suites.

  - id: MOZ-I-06
    control: key-exchange-groups
    title: TLS 1.3 groups match the profile
    severity: low
    on_violation: warn
    reference: "Server Side TLS 5.7, Intermediate: TLS curves"
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.3
    check:
      subject: tls.groups.tls13
      op: subset_of
      values: [x25519, secp256r1, secp384r1]
    remediation: Use X25519, prime256v1 and secp384r1.

  - id: MOZ-I-07
    control: key-exchange-groups
    title: TLS 1.2 curves match the profile
    severity: low
    on_violation: warn
    reference: "Server Side TLS 5.7, Intermediate: TLS curves"
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.2
    check:
      subject: tls.groups.tls12
      op: subset_of
      values: [x25519, secp256r1, secp384r1]
    remediation: Use X25519, prime256v1 and secp384r1.

  - id: MOZ-I-08
    control: dh-parameters
    title: DH parameters are at least 2048 bit
    severity: high
    reference: "Server Side TLS 5.7, Intermediate: DH parameter size 2048 (ffdhe2048)"
    when:
      subject: tls.dhe_prime_bits
      op: present
    check:
      subject: tls.dhe_prime_bits
      op: min
      value: 2048
    remediation: Use the ffdhe2048 group from RFC 7919 or larger.

  - id: MOZ-I-09
    control: certificate-key
    title: Certificate is ECDSA P-256 or RSA 2048 or larger
    severity: high
    reference: "Server Side TLS 5.7, Intermediate: certificate type"
    check:
      subject: certificate
      op: key_strength
      min_bits: {RSA: 2048, EC: 256}
    remediation: Use an ECDSA P-256 certificate (recommended) or RSA with at least 2048 bit.

  - id: MOZ-I-10
    control: certificate-signature
    title: Certificate is signed with SHA-256 or stronger
    severity: high
    reference: "Server Side TLS 5.7: certificate signature"
    when:
      subject: certificate.signature_hash
      op: present
    check:
      subject: certificate.signature_hash
      op: one_of
      values: [sha256, sha384, sha512]
    remediation: Re-issue the certificate with a SHA-256 or stronger signature.

  - id: MOZ-I-11
    control: certificate-lifetime
    title: Certificate lifetime does not exceed 366 days
    severity: low
    on_violation: warn
    reference: "Server Side TLS 5.7: maximum certificate lifespan 366 days (90 recommended)"
    check:
      subject: certificate.lifetime_days
      op: max
      value: 366
    remediation: Issue shorter-lived certificates and automate renewal (for example with ACME).

  - id: MOZ-I-12
    control: certificate-validity
    title: Certificate is within its validity period
    severity: high
    reference: "General requirement for server authentication"
    check:
      subject: certificate.expired
      op: is
      value: false
    remediation: Renew the certificate.

  - id: MOZ-I-13
    control: certificate-trust
    title: Certificate chain and host name verify
    severity: medium
    reference: "General requirement for server authentication"
    check:
      subject: certificate.trusted
      op: is
      value: true
      detail: certificate.trust_error
    remediation: Use a certificate from a trusted CA that covers the host name, and send the full chain.
