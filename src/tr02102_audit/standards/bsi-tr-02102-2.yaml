id: bsi-tr-02102-2
title: "BSI TR-02102-2: Use of Transport Layer Security (TLS)"
short_name: BSI TR-02102-2
publisher: Bundesamt für Sicherheit in der Informationstechnik (BSI)
edition: "2026-01"
url: https://www.bsi.bund.de/dok/TR-02102-en
description: >
  German federal recommendations for TLS: protocol versions, cipher suites,
  key-exchange groups and key lengths, each with a "use up to" year. The basis
  for the BSI minimum standard for TLS and widely used as the "state of the art"
  reference under NIS2 (§30 BSIG).
# "draft": the rules were transcribed from the published tables, but not yet
# reviewed line by line against the full PDF of this edition. See
# docs/STANDARDS.md for the review procedure.
transcription: draft

rules:
  - id: BSI-TLS-01
    control: protocol-versions
    title: Only TLS 1.2 and TLS 1.3 are offered
    severity: high
    reference: "TR-02102-2, sec. 3.2"
    check:
      subject: tls.protocol_versions
      op: subset_of
      values: [TLS1.2, TLS1.3]
    remediation: Disable SSL 3.0, TLS 1.0 and TLS 1.1 on the server.

  - id: BSI-TLS-02
    control: tls13-support
    title: TLS 1.3 is offered
    severity: low
    on_violation: warn
    reference: "TR-02102-2, sec. 3.2"
    check:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.3
    remediation: Enable TLS 1.3 in addition to TLS 1.2.

  - id: BSI-TLS-03
    control: tls12-cipher-suites
    title: TLS 1.2 cipher suites are recommended ones
    severity: high
    reference: "TR-02102-2, sec. 3.3.1, Tables 1 and 2"
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.2
    check:
      subject: tls.suites.tls12
      op: subset_of
      values:
        # Table 1: with perfect forward secrecy
        - {value: TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256, until: 2031}
        - {value: TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA384, until: 2031}
        - {value: TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256, until: 2031}
        - {value: TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384, until: 2031}
        - {value: TLS_ECDHE_ECDSA_WITH_AES_128_CCM, until: 2031}
        - {value: TLS_ECDHE_ECDSA_WITH_AES_256_CCM, until: 2031}
        - {value: TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256, until: 2031}
        - {value: TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384, until: 2031}
        - {value: TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256, until: 2031}
        - {value: TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384, until: 2031}
        - {value: TLS_DHE_DSS_WITH_AES_128_CBC_SHA256, until: 2031}
        - {value: TLS_DHE_DSS_WITH_AES_256_CBC_SHA256, until: 2031}
        - {value: TLS_DHE_DSS_WITH_AES_128_GCM_SHA256, until: 2031}
        - {value: TLS_DHE_DSS_WITH_AES_256_GCM_SHA384, until: 2031}
        - {value: TLS_DHE_RSA_WITH_AES_128_CBC_SHA256, until: 2031}
        - {value: TLS_DHE_RSA_WITH_AES_256_CBC_SHA256, until: 2031}
        - {value: TLS_DHE_RSA_WITH_AES_128_GCM_SHA256, until: 2031}
        - {value: TLS_DHE_RSA_WITH_AES_256_GCM_SHA384, until: 2031}
        - {value: TLS_DHE_RSA_WITH_AES_128_CCM, until: 2031}
        - {value: TLS_DHE_RSA_WITH_AES_256_CCM, until: 2031}
        # Table 2: without perfect forward secrecy, transitional
        - {value: TLS_ECDH_ECDSA_WITH_AES_128_GCM_SHA256, until: 2026}
        - {value: TLS_ECDH_ECDSA_WITH_AES_256_GCM_SHA384, until: 2026}
        - {value: TLS_ECDH_RSA_WITH_AES_128_GCM_SHA256, until: 2026}
        - {value: TLS_ECDH_RSA_WITH_AES_256_GCM_SHA384, until: 2026}
    remediation: >
      Restrict the TLS 1.2 cipher list to (EC)DHE suites with AES-GCM, AES-CCM
      or AES-CBC with SHA-256/384, for example
      ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256 in OpenSSL syntax.

  - id: BSI-TLS-04
    control: forward-secrecy
    title: Key exchange provides forward secrecy
    severity: high
    reference: "TR-02102-2, sec. 3.3.1, Table 2"
    check:
      subject: tls.suites_without_forward_secrecy
      op: subset_of
      values:
        - {value: TLS_ECDH_ECDSA_WITH_AES_128_GCM_SHA256, until: 2026}
        - {value: TLS_ECDH_ECDSA_WITH_AES_256_GCM_SHA384, until: 2026}
        - {value: TLS_ECDH_RSA_WITH_AES_128_GCM_SHA256, until: 2026}
        - {value: TLS_ECDH_RSA_WITH_AES_256_GCM_SHA384, until: 2026}
    remediation: Remove cipher suites with static RSA or static (EC)DH key exchange.

  - id: BSI-TLS-05
    control: broken-ciphers
    title: No broken or anonymous cipher suites
    severity: high
    reference: "TR-02102-2, sec. 3.3.1 (not in any recommended table)"
    check:
      subject: tls.suites_broken
      op: empty
    remediation: Remove NULL, anonymous, export, RC4, DES and 3DES cipher suites.

  - id: BSI-TLS-06
    control: tls13-cipher-suites
    title: TLS 1.3 cipher suites are recommended ones
    severity: high
    reference: "TR-02102-2, sec. 3.4, Table 13"
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.3
    check:
      subject: tls.suites.tls13
      op: subset_of
      values:
        - {value: TLS_AES_128_GCM_SHA256, until: 2031}
        - {value: TLS_AES_256_GCM_SHA384, until: 2031}
        - {value: TLS_AES_128_CCM_SHA256, until: 2031}
    remediation: >
      Offer only TLS_AES_256_GCM_SHA384, TLS_AES_128_GCM_SHA256 and optionally
      TLS_AES_128_CCM_SHA256 (OpenSSL: Ciphersuites).

  - id: BSI-TLS-07
    control: key-exchange-groups
    title: TLS 1.2 key-exchange groups are recommended ones
    severity: medium
    on_violation: warn
    reference: "TR-02102-2, sec. 3.3.2, Table 6"
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.2
    check:
      subject: tls.groups.tls12
      op: subset_of
      values:
        - {value: secp256r1, until: 2031}
        - {value: secp384r1, until: 2031}
        - {value: secp521r1, until: 2031}
        - {value: brainpoolP256r1, until: 2031}
        - {value: brainpoolP384r1, until: 2031}
        - {value: brainpoolP512r1, until: 2031}
        - {value: ffdhe3072, until: 2029}
        - {value: ffdhe4096, until: 2029}
    remediation: Limit the groups to NIST P-256/384/521 or Brainpool curves.

  - id: BSI-TLS-08
    control: key-exchange-groups
    title: TLS 1.3 key-exchange groups are recommended ones
    severity: medium
    on_violation: warn
    reference: "TR-02102-2, sec. 3.4, recommended Diffie-Hellman groups for TLS 1.3"
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.3
    check:
      subject: tls.groups.tls13
      op: subset_of
      values:
        - {value: secp256r1, until: 2031}
        - {value: secp384r1, until: 2031}
        - {value: secp521r1, until: 2031}
        - {value: brainpoolP256r1tls13, until: 2031}
        - {value: brainpoolP384r1tls13, until: 2031}
        - {value: brainpoolP512r1tls13, until: 2031}
        - {value: ffdhe3072, until: 2031}
        - {value: ffdhe4096, until: 2031}
    remediation: >
      Curve25519 (x25519) and hybrid post-quantum groups are not in this table.
      Whether to keep them is a risk decision; document it.

  - id: BSI-TLS-09
    control: dh-parameters
    title: Finite-field DH uses at least 3000-bit primes
    severity: high
    reference: "TR-02102-2, sec. 3.6; TR-02102-1"
    when:
      subject: tls.dhe_prime_bits
      op: present
    check:
      subject: tls.dhe_prime_bits
      op: min
      value: 3000
    remediation: Configure ffdhe3072 or larger DH parameters, or remove DHE suites.

  - id: BSI-TLS-10
    control: cbc-encrypt-then-mac
    title: CBC suites are used with Encrypt-then-MAC
    severity: medium
    reference: "TR-02102-2, sec. 3.3.4"
    check:
      subject: tls.cbc_without_encrypt_then_mac
      op: empty
    remediation: Enable the encrypt_then_mac extension (RFC 7366) or remove CBC suites.

  - id: BSI-TLS-11
    control: extended-master-secret
    title: Extended master secret is negotiated
    severity: medium
    reference: "TR-02102-2, sec. 3.3.4"
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.2
    check:
      subject: tls.extended_master_secret
      op: is
      value: true
    remediation: Enable the extended_master_secret extension (RFC 7627).

  - id: BSI-TLS-12
    control: certificate-key
    title: Certificate key length meets the minimum
    severity: high
    reference: "TR-02102-2, sec. 3.6; TR-02102-1"
    check:
      subject: certificate
      op: key_strength
      min_bits: {RSA: 3000, DSA: 3000, EC: 250}
    remediation: Issue the certificate with an RSA key of at least 3072 bit or an EC key on P-256 or larger.

  - id: BSI-TLS-13
    control: certificate-signature
    title: Certificate is signed with SHA-2
    severity: high
    reference: "TR-02102-1, hash functions"
    when:
      subject: certificate.signature_hash
      op: present
    check:
      subject: certificate.signature_hash
      op: one_of
      values: [sha256, sha384, sha512]
    remediation: Re-issue the certificate with a SHA-256 or stronger signature.

  - id: BSI-TLS-14
    control: certificate-validity
    title: Certificate is within its validity period
    severity: high
    reference: "General requirement for server authentication"
    check:
      subject: certificate.expired
      op: is
      value: false
    remediation: Renew the certificate.

  - id: BSI-TLS-15
    control: certificate-trust
    title: Certificate chain and host name verify
    severity: medium
    reference: "General requirement for server authentication"
    check:
      subject: certificate.trusted
      op: is
      value: true
      detail: certificate.trust_error
    remediation: Use a certificate from a trusted CA that covers the host name, and send the full chain.

  - id: BSI-TLS-16
    control: post-quantum
    title: Hybrid post-quantum key exchange is offered
    severity: info
    on_violation: warn
    reference: "TR-02102-1 (2026-01): classical-only key agreement recommended only until end of 2031"
    when:
      subject: tls.protocol_versions
      op: contains
      value: TLS1.3
    check:
      subject: tls.hybrid_pq_groups
      op: not_empty
    remediation: Plan the migration to a hybrid group such as SecP256r1MLKEM768 before 2032.
