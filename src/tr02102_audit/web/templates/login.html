{% extends "base.html" %}
{% block title %}Sign in · tr02102-audit{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Sign in</h1>
  {% if scanning_enabled %}
    <p class="muted">Scanning is restricted to authorised users.</p>
    <form method="post" class="form">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button class="btn" type="submit">Sign in</button>
    </form>
  {% else %}
    <p>Scanning is disabled on this instance because no password is configured.</p>
  {% endif %}
</section>
{% endblock %}
